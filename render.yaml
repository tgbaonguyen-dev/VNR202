# Deploy lên Render (render.com): New → Blueprint → chọn repo này.
services:
  - type: web
    name: vnr202-game
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false # nhập tay trên trang Render, không ghi vào repo
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
